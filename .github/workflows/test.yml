name: Test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: \${{ github.workspace }}
      BRIDGE_PROJECT_ID: test
      BRIDGE_ROOT: \${{ github.workspace }}
      BRIDGE_TOKEN: test-local-secret
      BRIDGE_ALLOW_WRITE: "true"
      BRIDGE_ALLOW_DELETE: "false"
      BRIDGE_ALLOW_COMMAND: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall bridge tests

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - run: python -m pytest -q
